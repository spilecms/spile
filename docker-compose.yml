services:
  spile:
    build:
      context: .
      dockerfile: Dockerfile
    image: spile:latest
    container_name: spile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=production
      - PORT=8080
      - DATABASE_PATH=/data/spile.db
      - UPLOADS_PATH=/data/uploads
      # MUST change this to a random secret string in production:
      # e.g., openssl rand -base64 48
      - SESSION_SECRET=change-this-to-a-very-secure-random-64-character-key
      # Comma-separated list of allowed frontend / consumer origins:
      - ALLOWED_ORIGINS=http://localhost:8080,http://localhost:3000
      # Max upload size in megabytes
      - MAX_UPLOAD_SIZE_MB=50
    volumes:
      # Persists SQLite database (/data/spile.db) and uploaded media (/data/uploads)
      - spile_data:/data

volumes:
  spile_data:
    name: spile_data
