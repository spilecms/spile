changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot[bot]
  categories:
    - title: "🚀 Features"
      labels:
        - "enhancement"
        - "feature"
      prefix:
        - "feat:"
        - "feat("
    - title: "🐛 Bug Fixes"
      labels:
        - "bug"
        - "fix"
      prefix:
        - "fix:"
        - "fix("
    - title: "📝 Documentation"
      labels:
        - "documentation"
        - "docs"
      prefix:
        - "docs:"
        - "docs("
    - title: "🧰 Maintenance & Refactoring"
      labels:
        - "chore"
        - "refactor"
      prefix:
        - "chore:"
        - "chore("
        - "refactor:"
        - "refactor("
